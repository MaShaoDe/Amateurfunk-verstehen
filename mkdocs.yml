site_name: "Amateurfunk verstehen. Lernen für HB3 und HB9 (Schweiz)"
site_author: Marcel Sauder
site_description: Lernmaterial für die schweizerischen Amateurfunkprüfungen HB3 (Novice) und HB9, offen und frei nutzbar
docs_dir: docs
use_directory_urls: false
theme:
  name: material
  language: de
  favicon: assets/images/favicon.png
  palette:
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/print.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
nav:
  - Start:
      - index.md
      - Über dieses Lehrwerk: 00-ueber-dieses-lehrwerk.md
  - Vorkurs & Übungsreihen:
      - Mathematik-Vorkurs (HB9): vk-mathematik-vorkurs.md
      - Mathematik-Vorkurs (HB3): vk-mathematik-vorkurs-hb3.md
      - Übungsreihe (HB9): vk-uebungsreihe.md
      - Übungsreihe Resultate (HB9): vk-uebungsreihe-resultate.md
      - Übungsreihe (HB3): vk-uebungsreihe-hb3.md
      - Übungsreihe Resultate (HB3): vk-uebungsreihe-hb3-resultate.md
      - Lerncheckliste (HB9): vk-lerncheckliste.md
      - Lerncheckliste (HB3): vk-lerncheckliste-hb3.md
      - Übungsblatt Q-Codes & Alphabet: uebungsblatt-q-codes-buchstabieralphabet.md
      - Übungsblatt U-R-I & Leistung: uebungsblatt-spannung-strom-widerstand-leistung.md
      - Übungsblatt Aussendungsarten (HB9): uebungsblatt-aussendungsarten-hb9.md
      - Übungsblatt Aussendungsarten (HB3): uebungsblatt-aussendungsarten-hb3.md
      - Übungsblatt Frequenztabelle HB3/HB9: uebungsblatt-frequenztabelle.md
  - Kapitel:
      - 1. Elektrische Grundlagen: 01-elektrische-grundlagen.md
      - 2. Frequenz, Periodendauer und Wellenlänge: 02-frequenz-wellenlaenge.md
      - 3. Elektromagnetische Wellen: 03-elektromagnetische-wellen.md
      - 4. Grundlagen der Antennentechnik: 04-antennen-grundlagen.md
      - 5. Antennenformen und Abstrahlung: 05-antennenformen.md
      - 6. Impedanz, Anpassung und SWR: 06-impedanz-anpassung-swr.md
      - 7. Speiseleitungen: 07-speiseleitungen.md
      - 8. Funkwellenausbreitung: 08-funkwellenausbreitung.md
      - 9. Sender und Empfänger: 09-sender-empfaenger.md
      - 10. Modulation und Betriebsarten: 10-modulation-betriebsarten.md
      - 11. Elektronische Bauteile und Schaltungen: 11-elektronische-bauteile-schaltungen.md
      - 12. Messtechnik: 12-messtechnik.md
      - 13. Praktischer Antennenbau: 13-praktischer-antennenbau.md
      - 14. Funkbetrieb: 14-funkbetrieb.md
      - 15. DX, Relais und Satelliten: 15-dx-relais-satelliten.md
      - 16. Sicherheit und EMV: 16-sicherheit-emv.md
      - 17. Amateurfunk in der Schweiz: 17-amateurfunk-schweiz.md
      - 18. Vorbereitung auf die Prüfung: 18-pruefungsvorbereitung.md
  - Hilfsmittel zum Download: downloads.md
