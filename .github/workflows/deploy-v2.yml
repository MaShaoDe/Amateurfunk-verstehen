name: Version 2 bauen und nach v2 veröffentlichen

on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: MathJax holen (liegt danach auf dem eigenen Server)
        run: |
          set -e
          npm pack mathjax@3.2.2 --silent
          tar -xzf mathjax-3.2.2.tgz
          mkdir -p docs/assets/mathjax
          cp -r package/es5/. docs/assets/mathjax/
          cp package/LICENSE docs/assets/mathjax/LICENSE || true
          test -f docs/assets/mathjax/tex-mml-chtml.js
          rm -rf package mathjax-3.2.2.tgz

      - name: Seite bauen
        run: mkdocs build --strict -d site

      - name: Test, Länge der Secrets (nur Zahlen, keine Werte)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Server: ${#S} Zeichen, Benutzer: ${#U} Zeichen, Passwort: ${#P} Zeichen"
          echo "Server endet mit Leerzeichen/Zeilenumbruch: $([[ "$S" =~ [[:space:]]$ ]] && echo ja || echo nein)"
          echo "Benutzer endet mit Leerzeichen/Zeilenumbruch: $([[ "$U" =~ [[:space:]]$ ]] && echo ja || echo nein)"
          echo "Passwort endet mit Leerzeichen/Zeilenumbruch: $([[ "$P" =~ [[:space:]]$ ]] && echo ja || echo nein)"

      - name: Test, Antwort des FTP-Servers (ohne Zugangsdaten)
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          echo "IP-Adresse: $(getent hosts "$S" | cut -d' ' -f1)"
          echo QUIT | timeout 20 openssl s_client -starttls ftp -connect "$S:21" -quiet 2>&1 | head -8 || true

      - name: Per FTPS in den Unterordner v2 hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: /v2/
